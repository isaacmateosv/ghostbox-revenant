# Pushing a tag vX.Y.Z (matching the VERSION file; vX.Y.Z-rc.N publishes a pre-release) builds, checks and
# publishes a GitHub release with the installer, the disk image and SHA-256 checksums.
# Signing and notarization happen only when the Apple secrets are configured (docs/RELEASING.md); without them
# the release is ad-hoc signed and the notes explain how to open it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SIGNING: ${{ secrets.MACOS_CERTIFICATES_P12 != '' }}
      NOTARIZING: ${{ secrets.MACOS_CERTIFICATES_P12 != '' && secrets.NOTARY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches VERSION
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          TAG=${GITHUB_REF_NAME#v}
          case "$TAG" in "$VERSION"|"$VERSION"-*) ;; *) echo "tag $GITHUB_REF_NAME does not match VERSION $VERSION"; exit 1 ;; esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./build.sh test

      - name: Import the Developer ID certificates
        if: env.SIGNING == 'true'
        env:
          MACOS_CERTIFICATES_P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
          MACOS_CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
        run: Tools/ci-import-certificates.sh

      - name: Build the installer
        env:
          GHOSTBOX_SIGN_IDENTITY: ${{ env.SIGNING == 'true' && secrets.MACOS_SIGN_IDENTITY || '-' }}
          GHOSTBOX_INSTALLER_IDENTITY: ${{ env.SIGNING == 'true' && secrets.MACOS_INSTALLER_IDENTITY || '' }}
        run: ./build.sh pkg

      - name: Notarize the installer
        if: env.NOTARIZING == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: Tools/notarize.sh "build/GhostBoxRevenant-$VERSION.pkg"

      - name: Build the disk image around it
        env:
          GHOSTBOX_SIGN_IDENTITY: ${{ env.SIGNING == 'true' && secrets.MACOS_SIGN_IDENTITY || '-' }}
        run: ./build.sh disk-image

      - name: Notarize the disk image
        if: env.NOTARIZING == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: Tools/notarize.sh "build/GhostBoxRevenant-$VERSION.dmg"

      - name: Check the artifacts and write checksums
        run: ./build.sh verify

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Tools/release-notes.sh "$VERSION" ${{ env.NOTARIZING == 'true' && 'signed' || '' }} > "$RUNNER_TEMP/notes.md"
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" build/dist/* --title "GhostBox Revenant $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/notes.md" $PRERELEASE
